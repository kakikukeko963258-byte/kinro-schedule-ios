name: Kinro
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kinro:
    type: application
    platform: iOS
    sources: [Kinro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studyquiz.dailyquiz
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: 金ロー予定
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  Kinro:
    build:
      targets:
        Kinro: all
    archive:
      config: Release
